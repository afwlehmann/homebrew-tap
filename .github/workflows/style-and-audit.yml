name: style-and-audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      casks: ${{ steps.list.outputs.casks }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          CASKS=$(ls Casks/*.rb | xargs -I{} basename {} .rb | jq -R . | jq -sc .)
          echo "casks=$CASKS" >> "$GITHUB_OUTPUT"

  style-and-audit:
    needs: discover
    runs-on: macos-latest
    strategy:
      matrix:
        cask: ${{ fromJson(needs.discover.outputs.casks) }}
    steps:
      - uses: actions/checkout@v4
      - name: Symlink tap
        run: |
          mkdir -p "$(brew --repo)/Library/Taps/afwlehmann"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repo)/Library/Taps/afwlehmann/homebrew-tap"
      - name: brew style
        run: brew style "Casks/${{ matrix.cask }}.rb"
      - name: brew audit
        run: brew audit --cask "${{ matrix.cask }}" --online --except=sha256_no_check_if_unversioned
